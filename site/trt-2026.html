<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tahoe Rim Trail 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#gtrk { max-width: 100%; margin: 0 auto; }
#gtrk-head { background: #1a1a18; color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-radius: 0; flex-wrap: wrap; }
#gtrk-dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; flex-shrink: 0; position: relative; }
#gtrk-dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #4ade80; opacity: .5; animation: gtrk-pulse 2s ease-out infinite; }
@keyframes gtrk-pulse { 0% { transform: scale(.8); opacity: .5; } 100% { transform: scale(1.8); opacity: 0; } }
#gtrk-title { font-size: 15px; font-weight: 600; }
#gtrk-sub { font-size: 12px; color: #a0a09a; margin-top: 2px; }
#gtrk-btns { margin-left: auto; display: flex; gap: 8px; }
.gtrk-btn { font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
.gtrk-btn-ghost { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); }
.gtrk-btn-orange { background: #FF6900; color: #fff; }
.gtrk-btn:hover { opacity: .85; }
#gtrk-map { width: 100%; height: calc(100vh - 120px); background: #d4d0c8; display: block; }
#gtrk-info { background: #fff; border: 1px solid #e5e4df; border-top: none; padding: 10px 20px; display: none; font-size: 13px; color: #333; gap: 16px; flex-wrap: wrap; }
#gtrk-info.visible { display: flex; }
.gtrk-chip { display: flex; flex-direction: column; gap: 2px; }
.gtrk-chip-label { font-size: 11px; color: #a0a09a; text-transform: uppercase; letter-spacing: .04em; }
.gtrk-chip-value { font-weight: 600; color: #1a1a18; }
.gtrk-chip-value.highlight { color: #FF6900; }
#gtrk-foot { background: #fff; border: 1px solid #e5e4df; border-top: none; border-radius: 0; padding: 12px 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
.gtrk-stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5a5a54; }
.gtrk-stat svg { color: #FF6900; flex-shrink: 0; }
#gtrk-status { font-size: 12px; color: #a0a09a; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
/* Cluster styling to match our blue theme */
.marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(59,130,246,0.3); }
.marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background-color: rgba(59,130,246,0.7); color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div id="gtrk">
  <div id="gtrk-head">
    <div id="gtrk-dot"></div>
    <div>
      <div id="gtrk-title">Loren &ldquo;Butterfingers&rdquo; on Trail</div>
      <div id="gtrk-sub">Live inReach satellite tracking &middot; Tahoe Rim Trail 2026</div>
    </div>
    <div id="gtrk-btns">
      <button class="gtrk-btn gtrk-btn-ghost" onclick="window.showFullTrack()">Show full track</button>
      <a class="gtrk-btn gtrk-btn-orange" href="https://share.garmin.com/9G2GF" target="_blank" rel="noopener">Garmin map ↗</a>
    </div>
  </div>
  <div id="gtrk-info">
    <div class="gtrk-chip"><span class="gtrk-chip-label">Last Seen</span><span class="gtrk-chip-value" id="gtrk-time">—</span></div>
    <div class="gtrk-chip"><span class="gtrk-chip-label">Coordinates</span><span class="gtrk-chip-value" id="gtrk-coords">—</span></div>
    <div class="gtrk-chip"><span class="gtrk-chip-label">Elevation</span><span class="gtrk-chip-value" id="gtrk-elev">—</span></div>
    <div class="gtrk-chip"><span class="gtrk-chip-label">Speed (last ping)</span><span class="gtrk-chip-value" id="gtrk-speed-last">—</span></div>
    <div class="gtrk-chip"><span class="gtrk-chip-label">Highest Elevation</span><span class="gtrk-chip-value highlight" id="gtrk-elev-high">—</span></div>
    <div class="gtrk-chip"><span class="gtrk-chip-label">Lowest Elevation</span><span class="gtrk-chip-value" id="gtrk-elev-low">—</span></div>
    <div class="gtrk-chip"><span class="gtrk-chip-label">Speed (trip avg)</span><span class="gtrk-chip-value" id="gtrk-speed-avg">—</span></div>
  </div>
  <div id="gtrk-map"></div>
  <div id="gtrk-foot">
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <span class="gtrk-stat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Garmin inReach satellite
      </span>
      <span class="gtrk-stat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Updates every 10 min on trail
      </span>
    </div>
    <span id="gtrk-status">Loading track…</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// Global scope so showFullTrack and map are accessible from button onclick
var map = L.map('gtrk-map', { zoomControl: true, scrollWheelZoom: true });
var trackBounds = null;

window.showFullTrack = function() {
  if (trackBounds) map.fitBounds(trackBounds, { padding: [30, 30] });
};

// Esri World Topo
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © <a href="https://www.esri.com/">Esri</a>',
  maxZoom: 18
}).addTo(map);

(function() {
  // ---- UPDATE THIS for each trip ----
  var d1 = '2026-07-10T00:00:00Z';
  var d2 = '2026-07-18T23:59:59Z';
  // ------------------------------------

  var PROXY = '/garmin-proxy';

  function getTagText(el, tag) {
    var n = el.getElementsByTagName(tag)[0];
    return n ? n.textContent.trim() : '';
  }

  function parseExtData(pm) {
    var result = {};
    var pairs = pm.getElementsByTagName('Data');
    for (var i = 0; i < pairs.length; i++) {
      var name = pairs[i].getAttribute('name');
      var val = getTagText(pairs[i], 'value');
      if (name) result[name] = val;
    }
    return result;
  }

  function formatTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function formatElev(meters) {
    if (!meters && meters !== 0) return '—';
    var ft = Math.round(parseFloat(meters) * 3.28084);
    return ft.toLocaleString() + ' ft';
  }

  function formatSpeed(kmh) {
    if (!kmh || parseFloat(kmh) === 0) return 'Stopped';
    return (parseFloat(kmh) * 0.621371).toFixed(1) + ' mph';
  }

  function formatCourse(degrees) {
    if (!degrees) return '—';
    var deg = parseFloat(degrees);
    var dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    var dir = dirs[Math.round(deg / 22.5) % 16];
    return dir + ' ' + Math.round(deg) + '°';
  }

  function tripAvgSpeed(allPoints) {
    var moving = allPoints.filter(function(p) { return p.speed && parseFloat(p.speed) > 0; });
    if (moving.length === 0) return '—';
    var total = moving.reduce(function(sum, p) { return sum + parseFloat(p.speed); }, 0);
    return ((total / moving.length) * 0.621371).toFixed(1) + ' mph';
  }

  function offsetLatLng(latlng, dx, dy) {
    var pt = map.latLngToContainerPoint(latlng);
    return map.containerPointToLatLng([pt.x + dx, pt.y + dy]);
  }

  var posIcon = L.divIcon({
    html: '<div style="width:16px;height:16px;background:#FF6900;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(255,105,0,.3)"></div>',
    iconSize: [16, 16], iconAnchor: [8, 8], className: ''
  });
  var pingIcon = L.divIcon({
    html: '<div style="width:10px;height:10px;background:#3b82f6;border:1.5px solid #fff;border-radius:50%;opacity:0.7"></div>',
    iconSize: [10, 10], iconAnchor: [5, 5], className: ''
  });
  var msgIcon = L.divIcon({
    html: '<div style="width:12px;height:12px;background:#3b82f6;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 3px rgba(59,130,246,.3)"></div>',
    iconSize: [12, 12], iconAnchor: [6, 6], className: ''
  });
  var startIcon = L.divIcon({
    html: '<div style="width:28px;height:28px;background:#22c55e;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3)">S</div>',
    iconSize: [28, 28], iconAnchor: [14, 14], className: ''
  });
  var finishIcon = L.divIcon({
    html: '<div style="width:28px;height:28px;background:#ef4444;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3)">F</div>',
    iconSize: [28, 28], iconAnchor: [14, 14], className: ''
  });

  var trackLine = null, posMarker = null, startMarker = null, finishMarker = null;
  var clusterGroup = null, msgMarkers = [], arrowMarkers = [], allPoints = [];

  function clearLayers() {
    if (trackLine) map.removeLayer(trackLine);
    if (posMarker) map.removeLayer(posMarker);
    if (startMarker) map.removeLayer(startMarker);
    if (finishMarker) map.removeLayer(finishMarker);
    if (clusterGroup) map.removeLayer(clusterGroup);
    msgMarkers.forEach(function(m) { map.removeLayer(m); });
    arrowMarkers.forEach(function(m) { map.removeLayer(m); });
    msgMarkers = []; arrowMarkers = [];
  }

  function drawArrows(points) {
    var step = 12;
    for (var a = step; a < points.length; a += step) {
      var p1 = map.latLngToLayerPoint(L.latLng(points[a - 1]));
      var p2 = map.latLngToLayerPoint(L.latLng(points[a]));
      var angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
      var mid = L.latLng(
        (points[a - 1][0] + points[a][0]) / 2,
        (points[a - 1][1] + points[a][1]) / 2
      );
      var arrow = L.marker(mid, {
        icon: L.divIcon({
          html: '<div style="transform:rotate(' + angle + 'deg);font-size:18px;color:#3b82f6;line-height:1;text-shadow:0 0 3px #fff;">➤</div>',
          iconSize: [18, 18], iconAnchor: [9, 9], className: ''
        }),
        interactive: false,
        zIndexOffset: 500
      }).addTo(map);
      arrowMarkers.push(arrow);
    }
  }

  function buildPopup(p) {
    return [
      '<b>' + formatTime(p.time) + '</b>',
      'Elevation: ' + formatElev(p.elev),
      'Speed: ' + formatSpeed(p.speed),
      'Heading: ' + formatCourse(p.course)
    ].join('<br>');
  }

  function loadTrack() {
    document.getElementById('gtrk-status').textContent = 'Loading track…';
    var url = PROXY + '?d1=' + d1 + '&d2=' + d2;

    fetch(url)
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(xml) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(xml, 'text/xml');
        var placemarks = doc.getElementsByTagName('Placemark');
        var points = [];
        allPoints = [];
        var latestPm = null, latestTime = 0;

        for (var i = 0; i < placemarks.length; i++) {
          var pm = placemarks[i];
          var coordStr = getTagText(pm, 'coordinates');
          if (!coordStr) continue;
          var parts = coordStr.trim().split(',');
          if (parts.length < 2) continue;
          var lng = parseFloat(parts[0]);
          var lat = parseFloat(parts[1]);
          if (isNaN(lat) || isNaN(lng)) continue;
          var when = getTagText(pm, 'when') || getTagText(pm, 'TimeStamp');
          var ext = parseExtData(pm);
          points.push([lat, lng]);
          allPoints.push({ lat: lat, lng: lng, time: when, speed: ext['Velocity'], elev: ext['Elevation'], course: ext['Course'], msg: ext['Text'] || '' });
          var t = when ? new Date(when).getTime() : 0;
          if (t > latestTime) { latestTime = t; latestPm = allPoints[allPoints.length - 1]; }
        }

        if (points.length === 0) {
          document.getElementById('gtrk-status').textContent = 'No track data yet — device not active';
          map.setView([39, -120], 9);
          return;
        }

        clearLayers();

        // Track line
        trackLine = L.polyline(points, { color: '#FF6900', weight: 3, opacity: 0.8 }).addTo(map);
        trackBounds = trackLine.getBounds();

        // Set view then draw arrows
        var last = points[points.length - 1];
        map.setView(last, 12);
        drawArrows(points);

        // Start marker offset left
        var first = allPoints[0];
        startMarker = L.marker(offsetLatLng(L.latLng(first.lat, first.lng), -18, 0), { icon: startIcon, zIndexOffset: 900 }).addTo(map);
        startMarker.bindPopup('<b>🟢 Start</b><br>' + formatTime(first.time) + '<br>' + formatElev(first.elev));

        // Finish marker offset right
        var d2Date = new Date(d2);
        var isLive = d2Date > new Date(Date.now() - 60000);
        if (isLive) {
          posMarker = L.marker(last, { icon: posIcon, zIndexOffset: 1000 }).addTo(map);
          if (latestPm) posMarker.bindPopup('<b>Current position</b><br>' + buildPopup(latestPm));
        } else {
          finishMarker = L.marker(offsetLatLng(L.latLng(last[0], last[1]), 18, 0), { icon: finishIcon, zIndexOffset: 1000 }).addTo(map);
          if (latestPm) finishMarker.bindPopup('<b>🔴 Finish</b><br>' + formatTime(latestPm.time) + '<br>' + formatElev(latestPm.elev));
        }

        // Clustered ping markers
        clusterGroup = L.markerClusterGroup({
          maxClusterRadius: 40,
          disableClusteringAtZoom: 14
        });

        allPoints.forEach(function(p, idx) {
          if (idx === 0) return;
          var marker;
          if (p.msg) {
            marker = L.marker([p.lat, p.lng], { icon: msgIcon });
            marker.bindPopup('<b>📍 Message</b><br>' + buildPopup(p) + '<br><i>' + p.msg + '</i>');
            msgMarkers.push(marker);
          } else {
            marker = L.marker([p.lat, p.lng], { icon: pingIcon });
            marker.bindPopup(buildPopup(p));
          }
          clusterGroup.addLayer(marker);
        });
        map.addLayer(clusterGroup);

        // Elevation stats
        var elevations = allPoints.filter(function(p) { return p.elev; }).map(function(p) { return parseFloat(p.elev); });
        var highElev = elevations.length ? Math.max.apply(null, elevations) : null;
        var lowElev = elevations.length ? Math.min.apply(null, elevations) : null;

        // Update info bar
        if (latestPm) {
          document.getElementById('gtrk-time').textContent = formatTime(latestPm.time);
          document.getElementById('gtrk-coords').textContent = latestPm.lat.toFixed(4) + '°, ' + latestPm.lng.toFixed(4) + '°';
          document.getElementById('gtrk-elev').textContent = formatElev(latestPm.elev);
          document.getElementById('gtrk-speed-last').textContent = formatSpeed(latestPm.speed);
          document.getElementById('gtrk-elev-high').textContent = highElev !== null ? formatElev(highElev) : '—';
          document.getElementById('gtrk-elev-low').textContent = lowElev !== null ? formatElev(lowElev) : '—';
          document.getElementById('gtrk-speed-avg').textContent = tripAvgSpeed(allPoints);
          document.getElementById('gtrk-info').classList.add('visible');
        }

        var pts = points.length;
        var msgs = msgMarkers.length;
        document.getElementById('gtrk-status').textContent =
          pts + ' track points' + (msgs > 0 ? ' · ' + msgs + ' message' + (msgs > 1 ? 's' : '') : '') + ' · Auto-refreshes every 10 min';
      })
      .catch(function(err) {
        document.getElementById('gtrk-status').textContent = 'Could not load track.';
        console.error('Garmin tracker error:', err);
        map.setView([39, -120], 9);
      });
  }

  loadTrack();
  setInterval(loadTrack, 10 * 60 * 1000);
})();
</script>
</body>
</html>
